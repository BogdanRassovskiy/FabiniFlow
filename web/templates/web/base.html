{% load static %}<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FabiniFlow{% endblock %} · AI Operations Agent</title>
  <link rel="stylesheet" href="{% static 'web/app.css' %}?v={{ asset_version }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">Fabini<span>Flow</span></div>
    <nav class="tabs">
      <a href="{% url 'web:customer' %}" class="{% if tab == 'customer' %}active{% endif %}">Zákazník</a>
      <a href="{% url 'web:shop_admin' %}" class="{% if tab == 'shop_admin' %}active{% endif %}">Administrace obchodů
        <span class="count-badge" id="attention-badge" title="Čeká na schválení / pozornost"
              {% if not attention_counts.total %}hidden{% endif %}>{{ attention_counts.total }}</span></a>
      <a href="{% url 'web:trace' %}" class="{% if tab == 'trace' %}active{% endif %}">Trace log</a>
    </nav>
    <div class="model-picker">
      {% csrf_token %}
      <label for="model-select" class="muted">Model</label>
      <select id="model-select" title="Model agenta (OpenRouter) – jen modely s tool calling"></select>
      <span class="pill bad" id="no-key" hidden>Chybí API klíč</span>
      <button type="button" class="ghost small" id="demo-reset"
              title="Vrátí objednávky, chaty, schválení, simulaci i trace do výchozího stavu">↺ Reset dema</button>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Živý odznak: každé 3 s zjistí počet položek čekajících na člověka.
    (function () {
      const badge = document.getElementById("attention-badge");
      const stale = document.getElementById("attention-stale");
      let last = {{ attention_counts.total }};
      async function poll() {
        try {
          const res = await fetch("{% url 'web:attention_api' %}", {cache: "no-store"});
          const {total} = await res.json();
          badge.textContent = total;
          badge.hidden = total === 0;
          if (total > last) {
            badge.classList.remove("pulse"); void badge.offsetWidth; badge.classList.add("pulse");
          }
          if (stale && total !== last) stale.hidden = false;
          last = total;
        } catch (e) { /* server dočasně nedostupný – zkusíme příště */ }
      }
      setInterval(poll, 3000);
    })();

    // Výběr modelu agenta (uloží se na serveru, platí pro další běhy).
    (async function () {
      const select = document.getElementById("model-select");
      try {
        const data = await (await fetch("{% url 'web:models_api' %}")).json();
        document.getElementById("no-key").hidden = data.has_key;
        const option = (m) => `<option value="${m.id}" ${m.id === data.current ? "selected" : ""}>` +
          `${m.label} · $${m.price}${m.vision ? " · 🖼" : ""}</option>`;
        const rec = data.models.filter((m) => m.recommended), rest = data.models.filter((m) => !m.recommended);
        select.innerHTML = `<optgroup label="Doporučené">${rec.map(option).join("")}</optgroup>` +
          `<optgroup label="Další modely s nástroji">${rest.map(option).join("")}</optgroup>`;
        if (!data.models.some((m) => m.id === data.current)) select.insertAdjacentHTML("afterbegin", option({id: data.current, label: data.current, price: "?"}));
      } catch (e) { select.innerHTML = "<option>nedostupné</option>"; }
      select.addEventListener("change", () => fetch("{% url 'web:models_api' %}", {
        method: "POST", body: new URLSearchParams({model: select.value}),
        headers: {"X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value},
      }));
    })();

    // Reset dema: všechna data zpět do výchozího stavu, pak znovu načíst stránku.
    document.getElementById("demo-reset").addEventListener("click", async (e) => {
      if (!confirm("Obnovit demo do výchozího stavu? Smažou se chaty, požadavky, schválení, incidenty i trace.")) return;
      e.target.disabled = true; e.target.textContent = "Obnovuji…";
      await fetch("{% url 'web:demo_reset' %}", {method: "POST"});
      location.reload();
    });
  </script>
</body>
</html>
